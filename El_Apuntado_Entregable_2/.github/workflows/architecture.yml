name: quality

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, pruebas y fitness functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verificación completa
        run: ./mvnw --batch-mode clean verify
      - name: Resumen de métricas
        if: always()
        run: |
          if [ -f target/architecture-metrics.md ]; then
            cat target/architecture-metrics.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f target/site/jacoco/jacoco.csv ]; then
            python3 -c "import csv; rows=list(csv.DictReader(open('target/site/jacoco/jacoco.csv'))); m=sum(int(r['LINE_MISSED']) for r in rows); c=sum(int(r['LINE_COVERED']) for r in rows); print(f'Cobertura de líneas: {c/(m+c):.1%}')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar reportes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
            target/site/jacoco/
            target/architecture-metrics.md

  integration:
    name: Integración con MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas de integración reales
        env:
          APUNTADO_MONGO_IT: 'true'
          APUNTADO_MONGO_URI: mongodb://localhost:27017
        run: ./mvnw --batch-mode -Dtest=MongoGameRepositoryIT test
      - name: Publicar reportes de integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mongo-integration-reports
          if-no-files-found: warn
          path: target/surefire-reports/
