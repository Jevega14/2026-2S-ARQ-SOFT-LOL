name: quality

# GitHub solo ejecuta workflows ubicados en la raíz del repositorio (.github/workflows).
# El proyecto vive en El_Apuntado_Entregable_2, por eso todos los pasos usan ese directorio.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: El_Apuntado_Entregable_2

defaults:
  run:
    working-directory: El_Apuntado_Entregable_2

jobs:
  verify:
    name: Build, pruebas y fitness functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: El_Apuntado_Entregable_2/pom.xml
      - name: Verificación completa (pruebas, ArchUnit, Checkstyle, JaCoCo)
        run: ./mvnw --batch-mode clean verify
      - name: Pruebas del script de métricas de validación con usuarios
        run: python3 -m unittest discover -s scripts -v
      - name: Resumen de métricas
        if: always()
        run: |
          {
            echo "## Fitness functions y métricas"
            if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
              echo '```'
              grep -h "Tests run" target/surefire-reports/*.txt
              echo '```'
            fi
            if [ -f target/site/jacoco/jacoco.csv ]; then
              python3 -c "import csv; rows=list(csv.DictReader(open('target/site/jacoco/jacoco.csv'))); m=sum(int(r['LINE_MISSED']) for r in rows); c=sum(int(r['LINE_COVERED']) for r in rows); bm=sum(int(r['BRANCH_MISSED']) for r in rows); bc=sum(int(r['BRANCH_COVERED']) for r in rows); print(f'Cobertura de líneas: {c/(m+c):.1%} · ramas: {bc/(bm+bc):.1%}')"
            fi
            [ -f target/architecture-metrics.md ] && cat target/architecture-metrics.md
            [ -f target/evaluator-benchmark.md ] && cat target/evaluator-benchmark.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          if-no-files-found: warn
          path: |
            ${{ env.PROJECT_DIR }}/target/surefire-reports/
            ${{ env.PROJECT_DIR }}/target/checkstyle-result.xml
            ${{ env.PROJECT_DIR }}/target/site/jacoco/
            ${{ env.PROJECT_DIR }}/target/architecture-metrics.md
            ${{ env.PROJECT_DIR }}/target/evaluator-benchmark.md

  integration:
    name: Integración con MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: El_Apuntado_Entregable_2/pom.xml
      - name: Pruebas de integración reales (*IT)
        env:
          APUNTADO_MONGO_IT: 'true'
          APUNTADO_MONGO_URI: mongodb://localhost:27017
        run: ./mvnw --batch-mode -Dtest='*IT' -Dsurefire.failIfNoSpecifiedTests=false -Djacoco.skip=true test
      - name: Resumen de integración
        if: always()
        run: |
          {
            echo "## Integración con MongoDB"
            echo '```'
            grep -h "Tests run" target/surefire-reports/*.txt || echo "Sin reportes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar reportes de integración
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mongo-integration-reports
          if-no-files-found: warn
          path: ${{ env.PROJECT_DIR }}/target/surefire-reports/

  release:
    name: Imagen Docker y smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar con docker compose
        run: docker compose up -d --build --wait
      - name: Smoke test de la API
        run: |
          curl --fail --silent http://localhost:8080/api/variants | tee variants.json
          grep -q CLASICA variants.json && grep -q APUNTADO101 variants.json
          curl --fail --silent -X POST http://localhost:8080/api/games \
            -H 'Content-Type: application/json' \
            -d '{"variantId":"APUNTADO101","players":[{"playerId":"p1","seat":0,"displayName":"Ana"},{"playerId":"p2","seat":1,"displayName":"Luis"}]}' \
            | tee game.json
          grep -q '"status":"ACTIVE"' game.json
      - name: Registro de auditoría generado
        if: always()
        run: cat logs/audit.jsonl || true
      - name: Bajar servicios
        if: always()
        run: docker compose down -v
